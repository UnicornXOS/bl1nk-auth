<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="--space-* tokens visualized" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: #f8fafc; padding: 20px 24px; font-family: var(--font-mono); }
    .row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .bar { background: var(--color-emerald); border-radius: 4px; width: 28px; }
    .lbl { font-size: 9px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:var(--space-1)"></div><div class="lbl">1<br>4px</div></div>
    <div class="item"><div class="bar" style="height:var(--space-2)"></div><div class="lbl">2<br>8px</div></div>
    <div class="item"><div class="bar" style="height:var(--space-3)"></div><div class="lbl">3<br>12px</div></div>
    <div class="item"><div class="bar" style="height:var(--space-4)"></div><div class="lbl">4<br>16px</div></div>
    <div class="item"><div class="bar" style="height:var(--space-5)"></div><div class="lbl">5<br>20px</div></div>
    <div class="item"><div class="bar" style="height:var(--space-6)"></div><div class="lbl">6<br>24px</div></div>
    <div class="item"><div class="bar" style="height:var(--space-8)"></div><div class="lbl">8<br>32px</div></div>
    <div class="item"><div class="bar" style="height:var(--space-10)"></div><div class="lbl">10<br>40px</div></div>
    <div class="item"><div class="bar" style="height:var(--space-12)"></div><div class="lbl">12<br>48px</div></div>
    <div class="item"><div class="bar" style="height:var(--space-16)"></div><div class="lbl">16<br>64px</div></div>
    <div class="item" style="margin-left:12px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:6px">
          <div class="bar" style="height:var(--sm);width:var(--sm)"></div><span style="font-size:9px;color:#64748b">--sm 4px</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="bar" style="height:var(--md);width:var(--md)"></div><span style="font-size:9px;color:#64748b">--md 8px</span>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="bar" style="height:var(--lg);width:var(--lg)"></div><span style="font-size:9px;color:#64748b">--lg 12px</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
