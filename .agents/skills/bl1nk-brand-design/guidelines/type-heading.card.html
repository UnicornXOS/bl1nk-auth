<!-- @dsCard group="Type" viewport="700x200" name="Heading — Noto Sans" subtitle="Display and heading typeface" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: #fff; padding: 20px 24px; }
    .specimen { font-family: var(--font-heading); line-height: 1.2; color: #0f172a; }
    .meta { font-family: var(--font-mono); font-size: 10px; color: #94a3b8; margin-bottom: 2px; }
    .row { margin-bottom: 12px; }
  </style>
<link id="gfont-Noto-Sans" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;500;600;700&amp;display=swap">
</head>
<body>
  <div class="row">
    <div class="meta">800 · 36px · --font-heading</div>
    <div class="specimen" style="font-size: 36px; font-weight: 800; letter-spacing: -0.02em; font-family: &quot;Noto Sans&quot;">The quick brown fox</div>
  </div>
  <div class="row">
    <div class="meta">600 · 24px</div>
    <div class="specimen" style="font-size: 24px; font-weight: 600; font-family: &quot;Noto Sans&quot;">Build something beautiful with bl1nk</div>
  </div>
  <div class="row">
    <div class="meta">400 · 18px</div>
    <div class="specimen" style="font-size:18px;font-weight:400;color:#475569">Design systems for the modern web — fast, consistent, beautiful.</div>
  </div>
</body>
</html>
