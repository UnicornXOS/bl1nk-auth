<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: #0f172a; padding: 20px 24px; }
    .meta { font-family: var(--font-mono); font-size: 10px; color: #475569; margin-bottom: 3px; }
    .row { margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="meta">500 · 18px · --font-mono</div>
    <div style="font-family:var(--font-mono);font-size:18px;font-weight:500;color:#34d399">const primary = oklch(0.765 0.149 162.5);</div>
  </div>
  <div class="row">
    <div class="meta">400 · 14px · code / tokens</div>
    <div style="font-family:var(--font-mono);font-size:14px;font-weight:400;color:#e2e8f0;line-height:1.7"><span style="color:#94a3b8">// bl1nk glass recipe</span><br>backdrop-filter: <span style="color:#34d399">blur(20px)</span> saturate(<span style="color:#34d399">140%</span>);<br>border-radius: <span style="color:#f9ca24">var(--radius-glass)</span>;</div>
  </div>
</body>
</html>
