<!-- @dsCard group="Brand" viewport="700x200" name="Neumorphic" subtitle="Soft inset shadow recipe — inputs & surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="../tweaks-panel.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { padding: 24px; }
  </style>
</head>
<body style="font-family: &quot;Geist Mono&quot;">
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200">
    <rect width="700" height="200" fill="#dde3ec"/>
    <rect x="105" y="40" width="245" height="120" rx="16" fill="#dde3ec" filter="url(#nm)"/>
    <rect x="370" y="40" width="245" height="120" rx="16" fill="#2d2f3a"/>
    <rect x="125" y="80" width="205" height="36" rx="18" fill="#dde3ec" filter="url(#nm)"/>
    <rect x="390" y="80" width="205" height="36" rx="18" fill="#2d2f3a" filter="url(#nmd)"/>
    <defs>
      <filter id="nm"><feDropShadow dx="-3" dy="-3" stdDeviation="4" flood-color="#fff" flood-opacity="0.8"/><feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#b0bec5" flood-opacity="0.5"/></filter>
      <filter id="nmd"><feDropShadow dx="-2" dy="-2" stdDeviation="3" flood-color="#3d4050" flood-opacity="0.6"/><feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#1a1c24" flood-opacity="0.8"/></filter>
    </defs>
  </svg>
</template>
<div id="root"></div>
<script type="text/babel">


const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "lightBg": "#dde3ec",
  "darkBg": "#2d2f3a",
  "radius": 12
} /*EDITMODE-END*/;

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const lightSurf = {
    borderRadius: t.radius,
    padding: '12px 16px',
    fontFamily: 'var(--font-body)',
    fontSize: 13,
    background: t.lightBg,
    color: '#1e293b',
    boxShadow: 'var(--shadow-neumorph-light)'
  };
  const darkSurf = {
    borderRadius: t.radius,
    padding: '12px 16px',
    fontFamily: 'var(--font-body)',
    fontSize: 13,
    background: t.darkBg,
    color: '#e2e8f0',
    boxShadow: 'var(--shadow-neumorph-dark)'
  };
  const lbl = { fontFamily: 'var(--font-mono)', fontSize: 10 };

  return (
    <div style={{ display: 'flex', gap: 24, alignItems: 'center' }}>
        <div style={{ flex: 1, padding: 20, borderRadius: 16, background: t.lightBg, display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div style={{ ...lbl, color: "rgb(30, 41, 59)" }}>Light mode · --shadow-neumorph-light</div>
          <input className="neumorphic-input" placeholder="Soft inset input…" style={{ width: '100%', borderRadius: '24px' }} />
          <div style={{ ...lightSurf, fontFamily: "\"Geist Mono\"", borderRadius: "20px" }}>Surface element</div>
        </div>
        <div style={{ flex: 1, padding: 20, borderRadius: 16, background: t.darkBg, display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div style={{ ...lbl, color: "rgb(191, 204, 224)" }}>Dark mode · --shadow-neumorph-dark</div>
          <input className="neumorphic-input" placeholder="Dark neumorphic input…" style={{ width: '100%', backgroundColor: "rgb(191, 204, 224)", borderRadius: "20px" }} />
          <div style={{ ...darkSurf, borderRadius: "20px", color: "rgb(191, 204, 224)" }}>Dark surface</div>
        </div>
        <TweaksPanel>
          <TweakSection label="Light surface" />
          <TweakColor label="Background" value={t.lightBg}
        options={['#e4e8ef', '#dde3ec', '#eef0f5', '#f0ece8']}
        onChange={(v) => setTweak('lightBg', v)} />
          <TweakSection label="Dark surface" />
          <TweakColor label="Background" value={t.darkBg}
        options={['#2a2d35', '#1e2028', '#252830', '#2d2f3a']}
        onChange={(v) => setTweak('darkBg', v)} />
          <TweakSection label="Shape" />
          <TweakSlider label="Radius" value={t.radius} min={4} max={24} step={2} unit="px"
        onChange={(v) => setTweak('radius', v)} />
        </TweaksPanel>
      </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
