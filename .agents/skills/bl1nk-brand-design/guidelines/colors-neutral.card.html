<!-- @dsCard group="Colors" viewport="700x130" name="Neutral Scale" subtitle="Full neutral ramp from 50→900" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: #f8fafc; padding: 20px 24px; font-family: var(--font-body); }
    .row { display: flex; gap: 6px; align-items: flex-end; }
    .sw { border-radius: 8px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.06); }
    .lbl { font-family: var(--font-mono); font-size: 9px; color: #64748b; margin-top: 4px; text-align: center; }
  </style>
</head>
<body>
  <div class="row">
    <div><div class="sw" style="width:52px;height:40px;background:var(--color-neutral-50)"></div><div class="lbl">50</div></div>
    <div><div class="sw" style="width:52px;height:44px;background:var(--color-neutral-100)"></div><div class="lbl">100</div></div>
    <div><div class="sw" style="width:52px;height:48px;background:var(--color-neutral-200)"></div><div class="lbl">200</div></div>
    <div><div class="sw" style="width:52px;height:52px;background:var(--color-neutral-300)"></div><div class="lbl">300</div></div>
    <div><div class="sw" style="width:52px;height:56px;background:var(--color-neutral-400)"></div><div class="lbl">400</div></div>
    <div><div class="sw" style="width:52px;height:60px;background:var(--color-neutral-500)"></div><div class="lbl">500</div></div>
    <div><div class="sw" style="width:52px;height:64px;background:var(--color-neutral-600)"></div><div class="lbl">600</div></div>
    <div><div class="sw" style="width:52px;height:68px;background:var(--color-neutral-700)"></div><div class="lbl">700</div></div>
    <div><div class="sw" style="width:52px;height:72px;background:var(--color-neutral-800)"></div><div class="lbl">800</div></div>
    <div><div class="sw" style="width:52px;height:76px;background:var(--color-neutral-900)"></div><div class="lbl">900</div></div>
  </div>
</body>
</html>
