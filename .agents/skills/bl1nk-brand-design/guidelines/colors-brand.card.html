<!-- @dsCard group="Colors" viewport="700x130" name="Brand Emerald" subtitle="Primary brand color — emerald green" -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: #fff; padding: 20px 24px; font-family: var(--font-body); }
    .row { display: flex; gap: 12px; align-items: flex-end; }
    .swatch { border-radius: 12px; flex-shrink: 0; }
    .name { font-size: 11px; font-weight: 600; color: #0f172a; margin-top: 6px; }
    .token { font-family: var(--font-mono); font-size: 10px; color: #64748b; margin-top: 2px; }
    .hex { font-family: var(--font-mono); font-size: 10px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="row">
    <div>
      <div class="swatch" style="width: 72px; height: 72px; background: var(--color-emerald-bright); border-width: 0px; border-style: solid"></div>
      <div class="name" style="font-family: &quot;Geist Mono&quot;">Bright</div>
      <div class="token">--color-emerald-bright</div>
    </div>
    <div>
      <div class="swatch" style="width:88px;height:88px;background:var(--color-emerald)"></div>
      <div class="name" style="font-family: &quot;Geist Mono&quot;">Emerald ★</div>
      <div class="token">--color-emerald</div>
      <div class="hex">#34d399</div>
    </div>
    <div>
      <div class="swatch" style="width:72px;height:72px;background:var(--color-emerald-dim)"></div>
      <div class="name">Dim</div>
      <div class="token">--color-emerald-dim</div>
    </div>
    <div style="margin-left:8px; display:flex; flex-direction:column; gap:6px; justify-content:flex-end">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:36px;height:36px;border-radius:8px;background:rgba(52,211,153,0.45)"></div>
        <div class="token">--color-emerald-glow<br><span class="hex">rgba(52,211,153,0.45)</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:36px;height:36px;border-radius:8px;background:var(--color-logo-teal)"></div>
        <div class="token">--color-logo-teal</div>
      </div>
    </div>
    <div style="margin-left:8px; display:flex; flex-direction:column; gap:6px; justify-content:flex-end">
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:36px;height:36px;border-radius:8px;background:var(--color-logo-orange)"></div>
        <div class="token">--color-logo-orange</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="width:36px;height:36px;border-radius:8px;background:var(--color-logo-pink)"></div>
        <div class="token">--color-logo-pink</div>
      </div>
    </div>
  </div>
</body>
</html>
