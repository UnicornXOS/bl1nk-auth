<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: #fff; padding: 24px; display: flex; gap: 32px; align-items: center; }
    .divider { width: 1px; background: #e2e8f0; align-self: stretch; }
    .wordmark { font-family: var(--font-heading); font-weight: 800; font-size: 40px; letter-spacing: -0.04em; color: #0f172a; }
    .wordmark span { color: var(--color-emerald); }
    .dark-bg { background: #0f172a; border-radius: 16px; padding: 24px; display: flex; align-items: center; gap: 16px; }
    .lbl { font-family: var(--font-mono); font-size: 10px; color: #94a3b8; margin-top: 8px; }
  </style>
</head>
<body>
  <div>
    <img src="../assets/logo.png" width="96" height="96" alt="bl1nk logo" style="display:block">
    <div class="lbl">assets/logo.png · 96px</div>
  </div>
  <div class="divider"></div>
  <div>
    <div class="wordmark">bl<span>1</span>nk</div>
    <div class="lbl">Noto Sans 800 · "1" in brand emerald</div>
  </div>
  <div class="divider"></div>
  <div class="dark-bg">
    <img src="../assets/logo.png" width="56" height="56" alt="bl1nk logo">
    <div style="font-family:var(--font-heading);font-weight:700;font-size:22px;color:#fff;letter-spacing:-0.02em">bl<span style="color:var(--color-emerald)">1</span>nk</div>
  </div>
</body>
</html>
