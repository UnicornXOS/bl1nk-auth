<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--background); color: var(--foreground); font-family: var(--font-body); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Button, Badge, Input, NeumorphicInput, GlowButton, GlassPanel } = window.Bl1nkDesignSystem_428be4;

    const lbl = {
      fontSize: 10,
      fontWeight: 600,
      color: '#94a3b8',
      textTransform: 'uppercase',
      letterSpacing: '0.08em',
      marginBottom: 8,
      fontFamily: 'var(--font-mono)',
    };

    function Row({ label, children, style }) {
      return (
        <div style={{ marginBottom: 18, ...style }}>
          <div style={lbl}>{label}</div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>{children}</div>
        </div>
      );
    }

    function App() {
      return (
        <div style={{ padding: '20px 24px' }}>
          <Row label="Button — variants">
            <Button>Default</Button>
            <Button variant="outline">Outline</Button>
            <Button variant="secondary">Secondary</Button>
            <Button variant="ghost">Ghost</Button>
            <Button variant="destructive">Destructive</Button>
            <Button variant="link">Link</Button>
          </Row>
          <Row label="Button — sizes">
            <Button size="xs">xs</Button>
            <Button size="sm">sm</Button>
            <Button>default</Button>
            <Button size="lg">lg</Button>
            <Button disabled>Disabled</Button>
          </Row>
          <Row label="Badge">
            <Badge>New</Badge>
            <Badge variant="secondary">Beta</Badge>
            <Badge variant="destructive">Error</Badge>
            <Badge variant="outline">Draft</Badge>
          </Row>
          <Row label="Input">
            <Input placeholder="Standard input…" style={{ width: 200 }} />
            <div style={{ background: '#2a2d35', borderRadius: 16, padding: '10px 14px', display: 'inline-flex' }}>
              <NeumorphicInput placeholder="Neumorphic…" style={{ width: 180 }} />
            </div>
          </Row>
          <Row label="GlowButton">
            <GlowButton size="sm">Get started</GlowButton>
            <GlowButton>Get started</GlowButton>
            <GlowButton size="lg">Get started</GlowButton>
            <GlowButton variant="outline">Learn more</GlowButton>
          </Row>
          <div style={{ background: 'conic-gradient(from 180deg at 50% 50%, #ff6b6b, #f9ca24, #6ab04c, #22a6b3, #4834d4, #be2edd, #ff6b6b)', borderRadius: 16, padding: 20, display: 'flex', gap: 16 }}>
            <GlassPanel style={{ padding: 20, flex: 1 }}>
              <div style={{ fontWeight: 600, marginBottom: 4 }}>Dark Glass</div>
              <div style={{ opacity: 0.8, fontSize: 13 }}>Smoked translucent slab</div>
            </GlassPanel>
            <GlassPanel tone="light" style={{ padding: 20, flex: 1 }}>
              <div style={{ fontWeight: 600, marginBottom: 4, color: '#0f172a' }}>Light Glass</div>
              <div style={{ color: '#0f172a', opacity: 0.75, fontSize: 13 }}>Frosted white slab</div>
            </GlassPanel>
            <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <GlowButton variant="glass">Glass CTA</GlowButton>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
